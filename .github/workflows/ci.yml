name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ship cadence here is many pushes a day — a superseded run is pure wasted minutes.
# Cancel the in-flight run when a newer push to the same ref lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A wedged run would otherwise burn the 360-minute default against the monthly quota.
    # 25, not 15: the DB suites run one file at a time (vitest.config.ts, project "db"), which took
    # ~8 minutes of `npm test` from the Mac; 15 left too little room for install + test + build.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A split shift is ordinary time entries (0288/0289), and 0290 dropped time_allocations. A
      # leftover embed of a dropped table fails the whole PostgREST query, so no code in src may
      # name it, tests included (the DB suite's conversion cases went with the table).
      - name: No time_allocations in src
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' time_allocations src; then
            echo "time_allocations is gone (0290): remove the references above." && exit 1
          fi

      - name: Type check
        run: npm run typecheck

      # The DB suites write (inside rolled-back transactions), so they may only ever reach the TEST
      # database. Until 2026-09 these secrets pointed at production and the suites wrote there. This
      # fails the job unless TEST_DB_* connect as the test project's user and find its marker row
      # (the same check src/lib/db-guard.ts runs inside every suite).
      - name: TEST_DB_* point at the test database
        run: node scripts/test-db/check-test-db.cjs
        env:
          TEST_DB_HOST: ${{ secrets.TEST_DB_HOST }}
          TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
          TEST_DBPW: ${{ secrets.TEST_DBPW }}

      - name: Test
        run: npm test
        env:
          # DB creds for every *.integration.test.ts (the TEST database only: the step above and
          # src/lib/db-guard.ts refuse anything else). They self-skip without these;
          # tests/ci-guard.test.ts fails the run if they're missing in CI, so the skip can never be
          # silent again.
          TEST_DB_HOST: ${{ secrets.TEST_DB_HOST }}
          TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
          TEST_DBPW: ${{ secrets.TEST_DBPW }}

      - name: Build
        run: npm run build
        env:
          # Builds don't need real secrets (all data pages are dynamic), but a
          # couple of public vars keep the client bundle happy.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
